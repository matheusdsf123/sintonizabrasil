<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sintoniza Brasil — Web Rádios e Emissoras Locais</title>
  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-surface: #131a2b;
      --bg-hover: #1c263f;
      --accent: #00e5ff;
      --accent-soft: rgba(0, 229, 255, 0.14);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 115px;
    }

    /* Cabeçalho Fixo */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .filtros-topo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .select-filtro, .search-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .select-filtro:focus, .search-box:focus {
      border-color: var(--accent);
    }

    .search-box { width: 250px; }

    /* Navegação por Abas Principais */
    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 22px 24px;
    }

    .pills-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .pills-bar::-webkit-scrollbar { display: none; }

    .pill {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .pill:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .pill.ativo {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .header-secao {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .btn-adicionar {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-adicionar:hover {
      background: var(--accent);
      color: #0b0f19;
    }

    /* Agrupamento por Seções */
    .grupo-titulo {
      font-size: 18px;
      font-weight: 700;
      margin: 26px 0 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grupo-titulo:first-of-type { margin-top: 8px; }

    /* Grade de Estações */
    .grid-estacoes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .card-estacao {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s, border-color 0.2s;
      position: relative;
    }

    .card-estacao:hover {
      background: var(--bg-hover);
      transform: translateY(-2px);
    }

    .card-estacao.ativa {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.12), rgba(19, 26, 43, 0.95));
      border-color: var(--accent);
    }

    .badge-icone {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      position: relative;
    }

    .eq-anim {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.78);
      border-radius: 12px;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
      padding-bottom: 14px;
    }

    .card-estacao.ativa.tocando .eq-anim { display: flex; }

    .eq-bar {
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      animation: bounce 0.6s infinite alternate;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; height: 18px; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; height: 12px; }

    @keyframes bounce {
      from { height: 5px; }
      to { height: 20px; }
    }

    .card-info {
      flex: 1;
      min-width: 0;
    }

    .tags-linha {
      display: flex;
      gap: 5px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .tag-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .tag-estado { background: rgba(0, 229, 255, 0.15); color: var(--accent); }
    .tag-estilo { background: rgba(148, 163, 184, 0.18); color: #cbd5e1; }
    .tag-tipo-web { background: rgba(16, 185, 129, 0.18); color: #34d399; }
    .tag-tipo-local { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }

    .card-info h3 {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .card-info p {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-fav {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: color 0.2s, transform 0.15s;
    }
    .btn-fav:hover { color: var(--danger); transform: scale(1.15); }
    .btn-fav.salvo { color: var(--danger); }

    /* Modal para Adicionar Rádio Customizada */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.aberto { display: flex; }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
    }
    .modal-box h2 { font-size: 18px; margin-bottom: 6px; }
    .modal-box p { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

    .form-grupo { margin-bottom: 12px; }
    .form-grupo label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .form-grupo input, .form-grupo select {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .modal-acoes {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    /* Dock Flutuante Inferior */
    .dock-player {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 1020px;
      background: rgba(19, 26, 43, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      z-index: 100;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
      flex: 1;
    }

    .dock-icone {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .now-text { min-width: 0; }
    .now-text h4 {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now-text span {
      font-size: 12px;
      color: var(--text-muted);
      display: block;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-step {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-step:hover { background: var(--bg-hover); border-color: var(--accent); }

    .btn-main-play {
      background: var(--accent);
      color: #0b0f19;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn-main-play:hover { transform: scale(1.07); }

    .dock-extras {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex: 1;
    }

    .timer-select {
      background: var(--bg-base);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .vol-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="range"] {
      width: 85px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .empty-msg {
      color: var(--text-muted);
      font-size: 14px;
      padding: 30px 0;
    }

    @media (max-width: 720px) {
      .dock-extras .vol-box { display: none; }
      .search-box { width: 100%; }
      .dock-player { padding: 10px 14px; bottom: 10px; width: calc(100% - 20px); }
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>Sintoniza Brasil</span>
    </div>

    <div class="filtros-topo">
      <select class="select-filtro" id="filtroEstado" onchange="aplicarFiltros()">
        <option value="todos">📍 Todos os Estados / Web</option>

        <option value="Adulto">Adulto / Flashback / Lo-Fi</option>
        <option value="Jornalismo">Jornalismo / Esportes / Regional</option>
      </select>

      <input type="text" class="search-box" id="inputBusca" placeholder="Buscar rádio, cidade ou estilo..." oninput="aplicarFiltros()">
    </div>
  </header>

  <main class="container">
    <!-- Pílulas de Acesso Rápido -->
    <nav class="pills-bar" id="pillsBar">
      <button class="pill ativo" onclick="selecionarAba('todos', this)">Todas (31)</button>
      <button class="pill" onclick="selecionarAba('PR', this)">🌲 Paraná (PR)</button>
      <button class="pill" onclick="selecionarAba('WEB', this)">🌐 Web Rádios (Hunter.FM)</button>
      <button class="pill" onclick="selecionarAba('SP', this)">🏙️ São Paulo (SP)</button>
      <button class="pill" onclick="selecionarAba('RJ', this)">🏖️ Rio de Janeiro (RJ)</button>
      <button class="pill" onclick="selecionarAba('RS', this)">🧉 Rio Grande do Sul (RS)</button>
      <button class="pill" onclick="selecionarAba('MG', this)">⛰️ Minas Gerais (MG)</button>
      <button class="pill" onclick="selecionarAba('NE', this)">☀️ Nordeste (BA/PE/CE)</button>
      <button class="pill" onclick="selecionarAba('favoritos', this)">♥ Favoritas</button>

    <div class="header-secao">

    </div>

    <div id="conteudoCatalogo"></div>
  </main>

  <!-- Modal para Adicionar Nova Rádio -->
  <div class="modal-overlay" id="modalAdicionar">
    <div class="modal-box">
      <h2>Adicionar Nova Emissora</h2>
      <p>Cole o link direto do streaming (.mp3, .aac ou /stream) capturado no navegador.</p>
      
      <div class="form-grupo">
        <label>Nome da Rádio</label>
        <input type="text" id="novoNome" placeholder="Ex: Educadora 103.9 FM">
      </div>
      <div class="form-grupo">
        <label>Cidade / Estado</label>
        <select id="novoEstado">
          <option value="PR">Paraná (PR)</option>
          <option value="SP">São Paulo (SP)</option>
          <option value="RJ">Rio de Janeiro (RJ)</option>
          <option value="RS">Rio Grande do Sul (RS)</option>
          <option value="MG">Minas Gerais (MG)</option>
          <option value="NE">Nordeste</option>
          <option value="WEB">Web Rádio</option>
        </select>
      </div>
      <div class="form-grupo">
        <label>Estilo Musical</label>
        <select id="novoEstilo">
          <option value="Sertanejo">Sertanejo / Modão</option>
          <option value="Jornalismo">Jornalismo / Esportes / Regional</option>
          <option value="Pop">Pop / Jovem</option>
          <option value="Rock">Rock / Alternativo</option>
          <option value="Pagode">Pagode / Samba / MPB</option>
          <option value="Gospel">Gospel / Religiosa</option>
          <option value="Adulto">Adulto / Flashback / Lo-Fi</option>
        </select>
      </div>
      <div class="form-grupo">
        <label>URL Direta do Áudio (HTTPS)</label>
        <input type="text" id="novoUrl" placeholder="https://servidor.com/stream">
      </div>

      <div class="modal-acoes">
        <button class="pill" onclick="fecharModal()">Cancelar</button>
        <button class="btn-adicionar" onclick="salvarNovaRadio()">Salvar na Lista</button>
      </div>
    </div>
  </div>

  <!-- Dock Flutuante Inferior -->
  <footer class="dock-player">
    <div class="now-playing">
      <div class="dock-icone" id="dockIcone" style="background: linear-gradient(135deg, #f59e0b, #b45309);">🤠</div>
      <div class="now-text">
        <h4 id="dockNome">Hunter Sertanejo</h4>
        <span id="dockStatus">Pronto para sintonizar</span>
      </div>
    </div>

    <div class="player-controls">
      <button class="btn-step" title="Estação Anterior" onclick="mudarFaixa(-1)">⏮</button>
      <button class="btn-main-play" id="btnPlay" title="Tocar / Pausar" onclick="alternarPlay()">▶</button>
      <button class="btn-step" title="Próxima Estação" onclick="mudarFaixa(1)">⏭</button>
    </div>

    <div class="dock-extras">
      <select class="timer-select" id="sleepTimer" title="Desligamento automático" onchange="configurarTimer()">
        <option value="0">⏱ Timer: Off</option>
        <option value="15">⏱ 15 min</option>
        <option value="30">⏱ 30 min</option>
        <option value="60">⏱ 60 min</option>
      </select>

      <div class="vol-box">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.85" oninput="mudarVolume()">
      </div>
    </div>
  </footer>

      // === RIO GRANDE DO SUL (RS) ===
      { id: 'rs_gaucha', nome: 'Rádio Gaúcha 93.7 FM', cidade: 'Porto Alegre - RS', estado: 'RS', estilo: 'Jornalismo', tipo: 'Local FM', desc: 'Jornalismo e Futebol Gaúcho', icone: '🧉', cor: 'linear-gradient(135deg, #15803d, #14532d)', url: 'https://liverdgaupoa.rbsdirect.com.br/primary/gaucha_rbs.sdp/chunklist_b64000.m3u8' },
      { id: 'rs_atlantida', nome: 'Rede Atlântida 94.3 FM', cidade: 'Porto Alegre - RS', estado: 'RS', estilo: 'Pop', tipo: 'Local FM', desc: 'Pop, Rock e Humor no Sul', icone: '🏄', cor: 'linear-gradient(135deg, #7c3aed, #4c1d95)', url: 'https://liverdatlpoa.rbsdirect.com.br/primary/atl_poa.sdp/chunklist_b64000.m3u8' },

      // === MINAS GERAIS (MG) ===
      { id: 'mg_itatiaia', nome: 'Rádio Itatiaia 95.7 FM', cidade: 'Belo Horizonte - MG', estado: 'MG', estilo: 'Jornalismo', tipo: 'Local FM', desc: 'A Rádio de Minas — Esportes e Notícias', icone: '⛰️', cor: 'linear-gradient(135deg, #dc2626, #7f1d1d)', url: 'https://8903.brasilstream.com.br/stream' },

      // === NORDESTE (BA / PE / CE) ===
      { id: 'ne_bahiafm', nome: 'Bahia FM 88.7', cidade: 'Salvador - BA', estado: 'NE', estilo: 'Pagode', tipo: 'Local FM', desc: 'Axé, Pagode Baiano e Sucessos', icone: '☀️', cor: 'linear-gradient(135deg, #ea580c, #c2410c)', url: 'https://playerservices.streamtheworld.com/api/livestream-redirect/BAHIAFMAAC.aac' }
    ];

    let radiosCustom = JSON.parse(localStorage.getItem('sintoniza_custom_radios') || '[]');
    let estacoes = [...estacoesBase, ...radiosCustom];

    const audio = document.getElementById('audioEngine');
    const conteudoCatalogo = document.getElementById('conteudoCatalogo');
    const btnPlay = document.getElementById('btnPlay');
    const dockNome = document.getElementById('dockNome');
    const dockStatus = document.getElementById('dockStatus');
    const dockIcone = document.getElementById('dockIcone');
    const controleVolume = document.getElementById('volume');

    let estacaoAtual = estacoes.find(e => e.id === 'web_sertanejo') || estacoes[0];
    let tocando = false;
    let favoritos = JSON.parse(localStorage.getItem('sintoniza_favoritos') || '[]');
    let abaAtiva = 'todos';
    let requisicaoId = 0;
    let timeoutConexao = null;
    let sleepTimeout = null;

    const nomesGrupos = {
      'PR': '🌲 Paraná (Laranjeiras do Sul, Curitiba e Rede)',
      'WEB': '🌐 Web Rádios Nacionais (Hunter.FM)',
      'SP': '🏙️ São Paulo (SP)',
      'RJ': '🏖️ Rio de Janeiro (RJ)',
      'RS': '🧉 Rio Grande do Sul (RS)',
      'MG': '⛰️ Minas Gerais (MG)',
      'NE': '☀️ Nordeste (BA / PE / CE)'
    };

    function renderizar() {
      const estadoSelect = document.getElementById('filtroEstado').value;
      const estiloSelect = document.getElementById('filtroEstilo').value;
      const termo = document.getElementById('inputBusca').value.toLowerCase().trim();

      const filtradas = estacoes.filter(est => {
        if (abaAtiva === 'favoritos' && !favoritos.includes(est.id)) return false;
        if (abaAtiva !== 'todos' && abaAtiva !== 'favoritos' && est.estado !== abaAtiva) return false;
        if (estadoSelect !== 'todos' && est.estado !== estadoSelect) return false;
        if (estiloSelect !== 'todos' && est.estilo !== estiloSelect) return false;

        if (termo) {
          const textoCompleto = `${est.nome} ${est.cidade} ${est.estilo} ${est.desc}`.toLowerCase();
          if (!textoCompleto.includes(termo)) return false;
        }
        return true;
      });

      if (filtradas.length === 0) {
        conteudoCatalogo.innerHTML = `<p class="empty-msg">Nenhuma rádio encontrada com esses filtros. Tente limpar a busca ou adicionar o link direto pelo botão acima.</p>`;
        return;
      }

      const grupos = {};
      filtradas.forEach(est => {
        if (!grupos[est.estado]) grupos[est.estado] = [];
        grupos[est.estado].push(est);
      });

      const ordemExibicao = ['PR', 'WEB', 'SP', 'RJ', 'RS', 'MG', 'NE'];
      let htmlFinal = '';

      ordemExibicao.forEach(codEstado => {
        if (!grupos[codEstado]) return;
        htmlFinal += `<div class="grupo-titulo">${nomesGrupos[codEstado] || codEstado} (${grupos[codEstado].length})</div>`;
        htmlFinal += `<div class="grid-estacoes">`;

        grupos[codEstado].forEach(est => {
          const isAtiva = est.id === estacaoAtual.id;
          const isFav = favoritos.includes(est.id);
          const tagTipoClass = est.tipo.includes('Web') ? 'tag-tipo-web' : 'tag-tipo-local';

          htmlFinal += `
            <div class="card-estacao ${isAtiva ? 'ativa' : ''} ${isAtiva && tocando ? 'tocando' : ''}" onclick="selecionarEstacao('${est.id}')">
              <div class="badge-icone" style="background: ${est.cor};">
                ${est.icone}
                <div class="eq-anim">
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                </div>
              </div>
              <div class="card-info">
                <div class="tags-linha">
                  <span class="tag-badge tag-estado">${est.estado}</span>
                  <span class="tag-badge tag-estilo">${est.estilo}</span>
                  <span class="tag-badge ${tagTipoClass}">${est.tipo}</span>
                </div>
                <h3>${est.nome}</h3>
                <p>${est.cidade} • ${est.desc}</p>
              </div>
              <button class="btn-fav ${isFav ? 'salvo' : ''}" title="Favoritar" onclick="toggleFavorito(event, '${est.id}')">
                ${isFav ? '♥' : '♡'}
              </button>
            </div>
          `;
        });

        htmlFinal += `</div>`;
      });

      conteudoCatalogo.innerHTML = htmlFinal;
    }

    function selecionarEstacao(id) {
      const encontrada = estacoes.find(e => e.id === id);
      if (!encontrada) return;

      estacaoAtual = encontrada;
      dockNome.innerText = `${estacaoAtual.nome} (${estacaoAtual.estado})`;
      dockIcone.innerText = estacaoAtual.icone;
      dockIcone.style.background = estacaoAtual.cor;

      iniciarStream();
    }

    function iniciarStream() {
      const idAtual = ++requisicaoId;
      clearTimeout(timeoutConexao);

      tocando = false;
      btnPlay.innerText = '⏳';
      dockStatus.innerText = `Conectando a ${estacaoAtual.nome}...`;
      dockStatus.style.color = 'var(--warning)';
      renderizar();

      audio.pause();
      audio.removeAttribute('src');
      audio.src = estacaoAtual.url;

      timeoutConexao = setTimeout(() => {
        if (idAtual === requisicaoId && !tocando) {
          dockStatus.innerText = 'Tempo esgotado — Emissora offline ou bloqueada';
          dockStatus.style.color = 'var(--danger)';
          btnPlay.innerText = '▶';
        }
      }, 9000);

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          if (idAtual !== requisicaoId || err.name === 'AbortError') return;
          clearTimeout(timeoutConexao);
          tocando = false;
          btnPlay.innerText = '▶';
          dockStatus.innerText = 'Stream indisponível no navegador (tente outra rádio)';
          dockStatus.style.color = 'var(--danger)';
          renderizar();
        });
      }
    }

    audio.addEventListener('playing', () => {
      clearTimeout(timeoutConexao);
      tocando = true;
      btnPlay.innerText = '⏸';
      dockStatus.innerText = `● Ao vivo • ${estacaoAtual.cidade}`;
      dockStatus.style.color = 'var(--success)';
      renderizar();
    });

    audio.addEventListener('error', () => {
      clearTimeout(timeoutConexao);
      tocando = false;
      btnPlay.innerText = '▶';
      dockStatus.innerText = 'Falha na transmissão desta emissora';
      dockStatus.style.color = 'var(--danger)';
      renderizar();
    });

    function alternarPlay() {
      if (!tocando) {
        iniciarStream();
      } else {
        requisicaoId++;
        clearTimeout(timeoutConexao);
        audio.pause();
        audio.removeAttribute('src');
        tocando = false;
        btnPlay.innerText = '▶';
        dockStatus.innerText = 'Transmissão pausada';
        dockStatus.style.color = 'var(--text-muted)';
        renderizar();
      }
    }

    function mudarFaixa(direcao) {
      const idxAtual = estacoes.findIndex(e => e.id === estacaoAtual.id);
      const novoIdx = (idxAtual + direcao + estacoes.length) % estacoes.length;
      selecionarEstacao(estacoes[novoIdx].id);
    }

    function mudarVolume() {
      audio.volume = controleVolume.value;
    }

    function toggleFavorito(evento, id) {
      evento.stopPropagation();
      if (favoritos.includes(id)) {
        favoritos = favoritos.filter(f => f !== id);
      } else {
        favoritos.push(id);
      }
      localStorage.setItem('sintoniza_favoritos', JSON.stringify(favoritos));
      renderizar();
    }

    function selecionarAba(aba, botao) {
      abaAtiva = aba;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('ativo'));
      botao.classList.add('ativo');

      const selectEstado = document.getElementById('filtroEstado');
      if (aba !== 'todos' && aba !== 'favoritos') {
        selectEstado.value = 'todos';
      }

      const titulos = {
        'todos': 'Catálogo Completo — Paraná, Estados e Web Rádios',
        'PR': 'Emissoras Locais e Regionais — Paraná (PR)',
        'WEB': 'Web Rádios Nacionais — Hunter.FM',
        'SP': 'Emissoras de São Paulo (SP)',
        'RJ': 'Emissoras do Rio de Janeiro (RJ)',
        'RS': 'Emissoras do Rio Grande do Sul (RS)',
        'MG': 'Emissoras de Minas Gerais (MG)',
        'NE': 'Emissoras do Nordeste (BA / PE / CE)',
        'favoritos': 'Suas Estações Favoritas'
      };
      document.getElementById('tituloSecao').innerText = titulos[aba] || 'Emissoras';
      renderizar();
    }

    function aplicarFiltros() {
      renderizar();
    }

    function configurarTimer() {
      clearTimeout(sleepTimeout);
      const minutos = parseInt(document.getElementById('sleepTimer').value, 10);
      if (minutos > 0) {
        sleepTimeout = setTimeout(() => {
          if (tocando) alternarPlay();
          document.getElementById('sleepTimer').value = '0';
          dockStatus.innerText = 'Desligado pelo temporizador';
        }, minutos * 60 * 1000);
      }
    }

    function abrirModal() {
      document.getElementById('modalAdicionar').classList.add('aberto');
    }

    function fecharModal() {
      document.getElementById('modalAdicionar').classList.remove('aberto');
    }

    function salvarNovaRadio() {
      const nome = document.getElementById('novoNome').value.trim();
      const estado = document.getElementById('novoEstado').value;
      const estilo = document.getElementById('novoEstilo').value;
      const url = document.getElementById('novoUrl').value.trim();

      if (!nome || !url) {
        alert('Preencha o nome da rádio e o link direto do áudio.');
        return;
      }

      const nova = {
        id: 'custom_' + Date.now(),
        nome: nome,
        cidade: `Adicionada (${estado})`,
        estado: estado,
        estilo: estilo,
        tipo: estado === 'WEB' ? 'Web Rádio' : 'Local FM',
        desc: 'Emissora personalizada',
        icone: '📻',
        cor: 'linear-gradient(135deg, #00e5ff, #0284c7)',
        url: url
      };

      radiosCustom.push(nova);
      localStorage.setItem('sintoniza_custom_radios', JSON.stringify(radiosCustom));
      estacoes = [...estacoesBase, ...radiosCustom];

      document.getElementById('novoNome').value = '';
      document.getElementById('novoUrl').value = '';
      fecharModal();
      renderizar();
      selecionarEstacao(nova.id);
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') { e.preventDefault(); alternarPlay(); }
      if (e.code === 'ArrowRight') mudarFaixa(1);
      if (e.code === 'ArrowLeft') mudarFaixa(-1);
    });

    renderizar();
  </script>
</body>
